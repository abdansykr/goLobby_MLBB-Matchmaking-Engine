<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Matchmaking - Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            min-height: 100px;
        }

        .status h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .message {
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .message.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .message.warning {
            background: #fff3e0;
            color: #f57c00;
        }

        .message.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .match-found {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            animation: pulse 1s ease infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            gap: 10px;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            flex: 1;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Antigravity</h1>
        <p class="subtitle">Mobile Legends Scrim Matchmaking</p>

        <div class="form-group">
            <label for="captainName">Captain Name</label>
            <input type="text" id="captainName" placeholder="Enter your name" value="ProPlayer123">
        </div>

        <div class="form-group">
            <label for="teamName">Team Name</label>
            <input type="text" id="teamName" placeholder="Enter team name" value="Team Alpha">
        </div>

        <div class="form-group">
            <label for="rank">Average Rank (0-100)</label>
            <input type="number" id="rank" min="0" max="100" placeholder="Enter rank" value="75">
        </div>

        <button id="enqueueBtn" onclick="enqueueTeam()">Find Match</button>
        <button id="cancelBtn" onclick="cancelMatch()"
            style="display:none; background: #f44336; margin-top: 10px;">Cancel Search</button>
        <button id="readyBtn" onclick="confirmReady()"
            style="display:none; background: #4caf50; margin-top: 10px;">Confirm Ready</button>

        <div class="status">
            <h3>Status</h3>
            <div id="statusMessages"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let teamId = null;
        let matchId = null;
        const API_URL = 'http://localhost:3000';
        const WS_URL = 'ws://localhost:3000';

        function addMessage(text, type = 'info') {
            const container = document.getElementById('statusMessages');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;

            // Keep only last 10 messages
            while (container.children.length > 10) {
                container.removeChild(container.firstChild);
            }
        }

        async function enqueueTeam() {
            const captainName = document.getElementById('captainName').value;
            const teamName = document.getElementById('teamName').value;
            const rank = parseInt(document.getElementById('rank').value);

            if (!captainName || !teamName || !rank) {
                addMessage('Please fill all fields!', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/matchmaking/enqueue`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        captain_name: captainName,
                        team_name: teamName,
                        average_rank: rank
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    teamId = data.team_id;
                    addMessage(`✅ ${data.message}`, 'success');
                    addMessage(`Team ID: ${teamId}`, 'info');

                    // Connect WebSocket
                    connectWebSocket(teamId);

                    // Update UI
                    document.getElementById('enqueueBtn').disabled = true;
                    document.getElementById('cancelBtn').style.display = 'block';
                } else {
                    addMessage(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, 'error');
            }
        }

        function connectWebSocket(teamId) {
            ws = new WebSocket(`${WS_URL}/ws?team_id=${teamId}`);

            ws.onopen = () => {
                addMessage('🔌 WebSocket connected', 'success');
                addMessage('🔍 Searching for opponent...', 'info');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'MATCH_FOUND') {
                    matchId = data.match_id;
                    const opponentName = data.data.opponent_name;
                    const opponentRank = data.data.opponent_rank;

                    const container = document.getElementById('statusMessages');
                    container.innerHTML = `
                        <div class="match-found">
                            <h2>🎮 MATCH FOUND!</h2>
                            <div class="stats">
                                <div class="stat">
                                    <div class="stat-value">${opponentName}</div>
                                    <div class="stat-label">Opponent</div>
                                </div>
                                <div class="stat">
                                    <div class="stat-value">${opponentRank}</div>
                                    <div class="stat-label">Rank</div>
                                </div>
                            </div>
                        </div>
                    `;

                    // Show ready button
                    document.getElementById('readyBtn').style.display = 'block';
                    document.getElementById('cancelBtn').style.display = 'none';

                    // Play notification sound (if supported)
                    try {
                        new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZUA0PV6bn7a5aFQxIo+Hxu3IlBjOK0vPPcj8JE2ey6vOnWBQLR6Le8btzIwgwhdDy0IoyCBhutO/mnlQNEVqn5Outcx8IJn7L8tiNPQgTY7Xr8axdGwYzi9L0z3dCCRdpte/hnFIOEVuj5u6qYx0IJnvM89yKQQkUZbTt75RSFg0QWqnn67BfGwk3jdX1yoI1ChhjsOzsnFsMEWCq6PGjYhoIL4HO8tmHRwoYaK/r76BTFxARV6fr7LFgGwg5j9X1yoNBCRdqsu3qn1oQDl6o6O+pYRsHOI/W9c6CNAM=').play();
                    } catch (e) { }
                }
            };

            ws.onerror = (error) => {
                addMessage('❌ WebSocket error', 'error');
            };

            ws.onclose = () => {
                addMessage('🔌 WebSocket disconnected', 'warning');
            };
        }

        async function confirmReady() {
            if (!teamId || !matchId) {
                addMessage('❌ Missing team or match ID', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/matchmaking/ready`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        team_id: teamId,
                        match_id: matchId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage('✅ Ready confirmed! Waiting for opponent...', 'success');
                    document.getElementById('readyBtn').disabled = true;
                } else {
                    addMessage(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, 'error');
            }
        }

        async function cancelMatch() {
            if (!teamId) return;

            try {
                const response = await fetch(`${API_URL}/api/matchmaking/cancel?team_id=${teamId}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (response.ok) {
                    addMessage('✅ Matchmaking cancelled', 'success');
                    reset();
                } else {
                    addMessage(`❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                addMessage(`❌ Connection error: ${error.message}`, 'error');
            }
        }

        function reset() {
            if (ws) {
                ws.close();
                ws = null;
            }
            teamId = null;
            matchId = null;
            document.getElementById('enqueueBtn').disabled = false;
            document.getElementById('cancelBtn').style.display = 'none';
            document.getElementById('readyBtn').style.display = 'none';
        }
    </script>
</body>

</html>

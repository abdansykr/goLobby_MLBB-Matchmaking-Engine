<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoLobby Scrim Matchmaking Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .teams-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-panel {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .team-panel h2 {
            color: #1e3c72;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2a5298;
        }

        .category-select {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .category-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .category-btn.active {
            background: #2a5298;
            color: white;
            border-color: #2a5298;
        }

        .category-btn.poke.active {
            background: #3498db;
            border-color: #3498db;
        }

        .category-btn.warkop.active {
            background: #f39c12;
            border-color: #f39c12;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #229954;
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .status-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
        }

        .status-box.searching {
            background: #fff3cd;
            border: 2px solid #ffc107;
        }

        .status-box.matched {
            background: #d4edda;
            border: 2px solid #28a745;
        }

        .status-box.expired {
            background: #f8d7da;
            border: 2px solid #dc3545;
        }

        .status-box.idle {
            background: #e9ecef;
            border: 2px solid #ced4da;
        }

        .match-info {
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .wa-button {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .wa-button:hover {
            background: #1EBE57;
        }

        .logs {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-left: 3px solid #3498db;
            padding-left: 10px;
        }

        .log-success {
            border-left-color: #27ae60;
        }

        .log-error {
            border-left-color: #e74c3c;
        }

        .controls {
            margin-bottom: 20px;
            text-align: center;
        }

        .controls button {
            width: auto;
            padding: 10px 30px;
            margin: 0 5px;
            background: #e74c3c;
        }

        .controls button:hover {
            background: #c0392b;
        }

        @media (max-width: 768px) {
            .teams-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 GoLobby Scrim Matchmaking Test</h1>

        <div class="teams-grid">
            <!-- Team 1 Panel -->
            <div class="team-panel">
                <h2>Team 1 (POKE/WARKOP)</h2>

                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="team1-name" value="Team Alpha" placeholder="Enter team name">
                </div>

                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="text" id="team1-wa" value="6281234567890" placeholder="628xxxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="category-select">
                        <button class="category-btn poke active" onclick="selectCategory(1, 'POKE')">POKE</button>
                        <button class="category-btn warkop" onclick="selectCategory(1, 'WARKOP')">WARKOP</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Rank Weight</label>
                    <input type="number" id="team1-rank" value="5" min="1" max="10">
                    <small id="team1-rank-hint" style="color: #7f8c8d;">POKE: 1-8, WARKOP: 9-10</small>
                </div>

                <button onclick="createRequest(1)" id="team1-btn">Find Scrim Match</button>

                <div class="status-box idle" id="team1-status">
                    <strong>Status:</strong> Idle<br>
                    <small>Click "Find Scrim Match" to start</small>
                </div>
            </div>

            <!-- Team 2 Panel -->
            <div class="team-panel">
                <h2>Team 2 (POKE/WARKOP)</h2>

                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="team2-name" value="Team Beta" placeholder="Enter team name">
                </div>

                <div class="form-group">
                    <label>WhatsApp Number</label>
                    <input type="text" id="team2-wa" value="6289876543210" placeholder="628xxxxxxxxxx">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <div class="category-select">
                        <button class="category-btn poke active" onclick="selectCategory(2, 'POKE')">POKE</button>
                        <button class="category-btn warkop" onclick="selectCategory(2, 'WARKOP')">WARKOP</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Rank Weight</label>
                    <input type="number" id="team2-rank" value="6" min="1" max="10">
                    <small id="team2-rank-hint" style="color: #7f8c8d;">POKE: 1-8, WARKOP: 9-10</small>
                </div>

                <button onclick="createRequest(2)" id="team2-btn">Find Scrim Match</button>

                <div class="status-box idle" id="team2-status">
                    <strong>Status:</strong> Idle<br>
                    <small>Click "Find Scrim Match" to start</small>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="clearAllRequests()">Clear All Requests</button>
            <button onclick="clearLogs()" style="background: #95a5a6;">Clear Logs</button>
        </div>

        <div class="logs" id="logs">
            <div class="log-entry">System ready. GoLobby Scrim Matchmaking Test v1.0</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let team1Category = 'POKE';
        let team2Category = 'POKE';
        let team1RequestID = null;
        let team2RequestID = null;
        let statusCheckInterval = null;

        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type === 'success' ? 'log-success' : type === 'error' ? 'log-error' : ''}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logsDiv.appendChild(entry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        }

        function selectCategory(teamNum, category) {
            const buttons = document.querySelectorAll(`#team${teamNum === 1 ? '1' : '2'}-name`).parentElement.parentElement.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            const selectedBtn = Array.from(buttons).find(btn => btn.textContent === category);
            if (selectedBtn) selectedBtn.classList.add('active');

            if (teamNum === 1) {
                team1Category = category;
                updateRankHint(1, category);
            } else {
                team2Category = category;
                updateRankHint(2, category);
            }
        }

        function updateRankHint(teamNum, category) {
            const hint = document.getElementById(`team${teamNum}-rank-hint`);
            const rankInput = document.getElementById(`team${teamNum}-rank`);

            if (category === 'POKE') {
                hint.textContent = 'POKE: 1-8 (±2 tolerance)';
                if (parseInt(rankInput.value) > 8) rankInput.value = 5;
            } else {
                hint.textContent = 'WARKOP: 9-10 (instant match)';
                if (parseInt(rankInput.value) < 9) rankInput.value = 9;
            }
        }

        async function createRequest(teamNum) {
            const teamName = document.getElementById(`team${teamNum}-name`).value;
            const waNumber = document.getElementById(`team${teamNum}-wa`).value;
            const category = teamNum === 1 ? team1Category : team2Category;
            const rankWeight = parseInt(document.getElementById(`team${teamNum}-rank`).value);

            // Validation
            if (!teamName || !waNumber) {
                log(`Team ${teamNum}: Please fill all fields`, 'error');
                return;
            }

            if (category === 'POKE' && (rankWeight < 1 || rankWeight > 8)) {
                log(`Team ${teamNum}: POKE category requires rank 1-8`, 'error');
                return;
            }

            if (category === 'WARKOP' && (rankWeight < 9 || rankWeight > 10)) {
                log(`Team ${teamNum}: WARKOP category requires rank 9-10`, 'error');
                return;
            }

            const body = {
                team_name: teamName,
                whatsapp_number: waNumber,
                category: category,
                rank_weight: rankWeight
            };

            log(`Team ${teamNum}: Creating ${category} request (Rank: ${rankWeight})...`);

            try {
                // Use custom header to simulate different IP for Team 2
                const headers = {
                    'Content-Type': 'application/json'
                };

                // Team 2 gets a different "IP" via header (for testing)
                if (teamNum === 2) {
                    headers['X-Forwarded-For'] = '192.168.1.' + Math.floor(Math.random() * 255);
                }

                const response = await fetch(`${API_URL}/api/scrim/request`, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    if (teamNum === 1) {
                        team1RequestID = data.request_id;
                    } else {
                        team2RequestID = data.request_id;
                    }

                    log(`Team ${teamNum}: ✅ Request created! ID: ${data.request_id}`, 'success');
                    updateStatus(teamNum, 'searching', data);

                    // Start status checking
                    if (!statusCheckInterval) {
                        statusCheckInterval = setInterval(checkAllStatuses, 2000);
                    }
                } else {
                    log(`Team ${teamNum}: ❌ ${data.error}`, 'error');
                }
            } catch (error) {
                log(`Team ${teamNum}: ❌ Network error: ${error.message}`, 'error');
            }
        }

        async function checkAllStatuses() {
            if (team1RequestID) checkStatus(1, team1RequestID);
            if (team2RequestID) checkStatus(2, team2RequestID);
        }

        async function checkStatus(teamNum, requestID) {
            try {
                const response = await fetch(`${API_URL}/api/scrim/request/${requestID}`);
                const data = await response.json();

                if (response.ok) {
                    if (data.status === 'matched' && data.match) {
                        log(`Team ${teamNum}: 🎉 MATCH FOUND! Opponent: ${data.match.opponent_name}`, 'success');
                        updateStatus(teamNum, 'matched', data);

                        // Stop checking for this team
                        if (teamNum === 1) team1RequestID = null;
                        else team2RequestID = null;
                    } else if (data.status === 'expired') {
                        log(`Team ${teamNum}: ⏱️ Request expired`, 'error');
                        updateStatus(teamNum, 'expired', data);

                        if (teamNum === 1) team1RequestID = null;
                        else team2RequestID = null;
                    }
                }
            } catch (error) {
                console.error(`Error checking status for team ${teamNum}:`, error);
            }
        }

        function updateStatus(teamNum, status, data) {
            const statusBox = document.getElementById(`team${teamNum}-status`);
            statusBox.className = `status-box ${status}`;

            let html = `<strong>Status:</strong> ${status.toUpperCase()}<br>`;

            if (status === 'searching') {
                html += `<small>Request ID: ${data.request_id}</small><br>`;
                html += `<small>Category: ${data.category}, Rank: ${data.rank_weight}</small><br>`;
                html += `<small>Expires: ${new Date(data.expires_at).toLocaleTimeString()}</small>`;
                html += `<div style="margin-top:10px;">🔍 Searching for opponent...</div>`;
            } else if (status === 'matched' && data.match) {
                html += `<div class="match-info">`;
                html += `<strong>🎉 MATCH FOUND!</strong><br>`;
                html += `Opponent: <strong>${data.match.opponent_name}</strong><br>`;
                html += `Contact: ${data.match.opponent_number}<br>`;
                html += `Expires in: ${data.match.expires_in}s<br>`;
                html += `<a href="${data.match.whatsapp_url}" target="_blank" class="wa-button">
                    📱 Open WhatsApp
                </a>`;
                html += `</div>`;
            } else if (status === 'expired') {
                html += `<small>This request has expired (30 min timeout)</small>`;
            }

            statusBox.innerHTML = html;
        }

        function clearAllRequests() {
            team1RequestID = null;
            team2RequestID = null;

            if (statusCheckInterval) {
                clearInterval(statusCheckInterval);
                statusCheckInterval = null;
            }

            document.getElementById('team1-status').className = 'status-box idle';
            document.getElementById('team1-status').innerHTML = '<strong>Status:</strong> Idle<br><small>Click "Find Scrim Match" to start</small>';

            document.getElementById('team2-status').className = 'status-box idle';
            document.getElementById('team2-status').innerHTML = '<strong>Status:</strong> Idle<br><small>Click "Find Scrim Match" to start</small>';

            log('✅ All requests cleared', 'success');
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '<div class="log-entry">Logs cleared. System ready.</div>';
        }
    </script>
</body>

</html>

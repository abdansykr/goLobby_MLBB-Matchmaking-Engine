global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'golobby-app'
    static_configs:
      - targets: ['app:2112']
    metrics_path: /metrics

  - job_name: 'golobby-ocr'
    static_configs:
      - targets: ['ocr-service:8001']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
